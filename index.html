<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud Computing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            color: #333;
            text-align: center;
            margin: 0;
            padding-bottom: 50px;
        }

        .logo-container {
            padding: 30px 0 10px 0;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .logo {
            max-height: 80px;
            width: auto;
        }

        h1 {
            color: #2c3e50;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        h2 {
            color: #34495e;
            margin-top: 5px;
            margin-bottom: 25px;
        }

        p {
            font-size: 18px;
            margin-bottom: 40px;
            color: #444;
        }

        button {
            background-color: #2980b9;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3498db;
        }
    </style>
</head>

<body>

    <!-- Logo Santo Tomás -->
    <div class="logo-container">
        <img 
            src="logo_santo.png" 
            alt="Logo Santo Tomás" 
            class="logo"
        >
    </div>

    <h1>Cloud Computing</h1>

    <h2>Mi primer sistema Cloud</h2>

    <p>
        Sistema creado en la asignatura Computación en la Nube
        del Instituto Profesional Santo Tomás
    </p>

    <button>Ingresar al sistema</button>

</body>
</html>
